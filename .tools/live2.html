aragraphs":["Инженер приезжает на объект, проверяет геометрию и помогает выбрать решение. Замер и консультация 0 руб. После утверждения стоимости мы заключаем договор, оплата проходит в 2 этапа: 80% на старте работ и 20% после принятия работ по монтажу. В договоре мы указываем длительность гарантии и срок гарантийного обслуживания конструкции."],"image":"https://new-site.xn----htbbbudhytelf.xn--p1ai/wp-content/themes/steklosistemy/landing/assets/step-02.jpg"},{"title":"Производство","paragraphs":["Изготавливаем конструкцию на собственном производстве под размеры вашего объекта. Контролируем качество стекла, фурнитуры и сборки перед отправкой на монтаж."],"image":"https://new-site.xn----htbbbudhytelf.xn--p1ai/wp-content/themes/steklosistemy/landing/assets/steps-3.png"},{"title":"Монтаж и сдача","paragraphs":["Своя бригада устанавливает конструкцию, убирает за собой и передаёт объект с фото- и видеоотчётом. После монтажа действует гарантия и сервисное обслуживание."],"image":"https://new-site.xn----htbbbudhytelf.xn--p1ai/wp-content/themes/steklosistemy/landing/assets/steps-4.png"}]}};
